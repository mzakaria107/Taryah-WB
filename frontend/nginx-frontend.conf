server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Never cache index.html or service worker — must always be fresh
    location = /index.html {
        expires 0;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    location = /sw.js {
        expires 0;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache hashed assets forever (Vite fingerprinted files)
    location ~* \.(js|css|woff2|woff|ttf|ico|png|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
