# Auto-deploys to production via the self-hosted runner on the server.
name: Deploy to production

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: [self-hosted, Windows]
    defaults:
      run:
        shell: powershell
    steps:
      - name: Pull latest code
        run: |
          cd C:\apps\Taryah-WB
          git config core.fscache false
          git fetch origin main
          $maxAttempts = 15
          for ($i = 1; $i -le $maxAttempts; $i++) {
            git reset --hard origin/main
            if ($LASTEXITCODE -eq 0) { break }
            if ($i -eq $maxAttempts) {
              Write-Error "git reset --hard failed after $maxAttempts attempts"
              exit 1
            }
            Write-Host "git reset --hard failed (attempt $i/$maxAttempts), likely a transient Windows file-lock race - retrying in 5s..."
            Start-Sleep -Seconds 5
          }

      - name: Build frontend
        run: |
          cd C:\apps\Taryah-WB\frontend
          npm install
          npm run build

      - name: Install backend dependencies
        run: |
          cd C:\apps\Taryah-WB\backend
          npm install

      - name: Restart backend
        run: |
          $env:PM2_HOME = "C:\Users\Administrator\.pm2"
          $pm2 = "C:\Users\Administrator\AppData\Roaming\npm\pm2.cmd"
          & $pm2 restart taryah-backend
          & $pm2 save

      - name: Report migration failures
        continue-on-error: true
        run: |
          Start-Sleep -Seconds 8
          $log = "C:\Users\Administrator\.pm2\logs\taryah-backend-error.log"
          if (Test-Path $log) {
            Get-Content $log -Tail 300 | Select-String -Pattern "Migration failed|migration" | Select-Object -Last 5 | ForEach-Object {
              Write-Host "::warning title=migration::$($_.Line)"
            }
          }
          $out = "C:\Users\Administrator\.pm2\logs\taryah-backend-out.log"
          if (Test-Path $out) {
            Get-Content $out -Tail 300 | Select-String -Pattern "migration applied" | Select-Object -Last 5 | ForEach-Object {
              Write-Host "::notice title=migration::$($_.Line)"
            }
          }

      - name: Verify site is up
        run: |
          Start-Sleep -Seconds 5
          try {
            $response = Invoke-WebRequest -Uri "https://www.sales.taryahpoultry.com.sa/api/health" -UseBasicParsing -TimeoutSec 20
            $code = $response.StatusCode
          } catch {
            $code = $_.Exception.Response.StatusCode.value__
          }
          Write-Host "Health check status: $code"
          if ($code -ne 200) {
            Write-Error "Health check failed with status $code"
            exit 1
          }
