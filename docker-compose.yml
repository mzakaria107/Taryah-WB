services:
  postgres:
    image: postgres:16-alpine
    container_name: cb_postgres
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${DB_USER:-cbuser}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-cbpassword}
      POSTGRES_DB: ${DB_NAME:-customer_balance_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-cbuser}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cb_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cb_backend
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://${DB_USER:-cbuser}:${DB_PASSWORD:-cbpassword}@postgres:5432/${DB_NAME:-customer_balance_db}
      JWT_SECRET: ${JWT_SECRET:-change-this-in-production-secret}
      JWT_EXPIRY: 24h
      UPLOAD_DIR: /app/uploads
      MAX_FILE_SIZE_MB: 50
      NODE_ENV: ${NODE_ENV:-production}
    volumes:
      - uploads_data:/app/uploads
    networks:
      - cb_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cb_frontend
    restart: unless-stopped
    networks:
      - cb_network

  nginx:
    image: nginx:1.27-alpine
    container_name: cb_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - "C:/certs:/etc/ssl/certs:ro"
    depends_on:
      - backend
      - frontend
    networks:
      - cb_network

volumes:
  postgres_data:
  uploads_data:

networks:
  cb_network:
    driver: bridge
