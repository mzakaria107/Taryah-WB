worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile      on;
    keepalive_timeout 65;

    client_max_body_size 60M;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/javascript
               application/json application/xml image/svg+xml;

    # ── HTTP → HTTPS redirect ──────────────────────────────────
    server {
        listen 80;
        server_name www.sales.taryahpoultry.com.sa sales.taryahpoultry.com.sa;
        return 301 https://www.sales.taryahpoultry.com.sa$request_uri;
    }

    # ── HTTPS ──────────────────────────────────────────────────
    server {
        listen 443 ssl;
        server_name www.sales.taryahpoultry.com.sa;

        ssl_certificate     C:/certs/fullchain.pem;
        ssl_certificate_key C:/certs/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header X-Content-Type-Options nosniff always;

        # React static files
        root  C:/apps/Taryah-WB/frontend/dist;
        index index.html;

        # API reverse proxy → Node.js backend on port 3000
        location /api/ {
            proxy_pass         http://127.0.0.1:3000;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 120s;
        }

        # Uploaded files served by the backend
        location /uploads/ {
            proxy_pass http://127.0.0.1:3000;
        }

        # Static assets — long cache
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # SPA fallback — all non-asset routes → index.html
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
